# Die Pruefungen der Verwaltung laufen bei jeder Aenderung.
#
# Anlass (02.09.2026): "Neue Show erscheint nicht im Frontend." Die Tests unter
# scripts/ gab es laengst, ausgefuehrt hat sie aber nur, wer daran dachte —
# dieses Repo hatte bis dahin gar keinen Workflow. Netlify baut hier nichts, es
# liefert public/ nur aus; eine kaputte Datei faellt also erst im Browser des
# Kunden auf.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Alle Pruefungen
        run: node --test scripts/*.test.mjs

      # Die Verwaltung laeuft ohne Bauwerkzeug im Browser: ein Tippfehler in
      # einer Datei ist erst zur Laufzeit ein Fehler. Darum jede Datei einmal
      # einlesen lassen.
      - name: Jede JavaScript-Datei ist syntaktisch heil
        run: |
          fehler=0
          for f in public/js/*.js; do
            node --check "$f" || { echo "FEHLER in $f"; fehler=1; }
          done
          exit $fehler
